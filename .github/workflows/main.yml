name: Personel Rehber Kontrolü

on:
  workflow_dispatch:
  schedule:
    - cron: "10 6 * * 1-5" # Hafta içi 09:10 Türkiye saati

concurrency:
  group: personel-rehber
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Önceki personel listesini yükle
        uses: actions/cache/restore@v4
        with:
          path: rehber_durumu.csv
          key: personel-state-${{ github.run_id }}
          restore-keys: personel-state-

      - name: Rehberi kontrol et
        env:
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ALLOWED_CHAT_ID: ${{ secrets.TG_ALLOWED_CHAT_ID }}
        run: python mau_rehber.py

      - name: Güncel personel listesini sakla
        if: success()
        uses: actions/cache/save@v4
        with:
          path: rehber_durumu.csv
          key: personel-state-${{ github.run_id }}

      - name: Teşhis çıktısını sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: personel-rehber-hata-${{ github.run_id }}
          path: rehber_durumu.csv
          if-no-files-found: ignore
          retention-days: 7
